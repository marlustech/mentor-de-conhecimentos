<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Core Mentor // Java 25 & Spring AI</title>
    <!-- Three.js via CDN confiável -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --glass-bg: rgba(16, 24, 40, 0.75);
            --glass-border: rgba(99, 102, 241, 0.35);
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .glass-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 860px;
            height: 85vh;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
            0 0 40px rgba(99, 102, 241, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.15s ease-out;
        }

        .header {
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.4);
        }

        #chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--glass-border) transparent;
        }

        #chat-box::-webkit-scrollbar {
            width: 6px;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background-color: var(--glass-border);
            border-radius: 3px;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.6;
            animation: fadeIn 0.3s ease forwards;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #e2e8f0;
            border-bottom-left-radius: 2px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        .ai-message pre {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            white-space: pre;
        }

        .ai-message code {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            color: #38bdf8;
        }

        .input-panel {
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.7);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 12px;
        }

        .input-panel input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .input-panel input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        .btn-send {
            padding: 14px 26px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
        }

        .btn-send:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<canvas id="webgl-canvas"></canvas>

<div class="glass-container" id="panel">
    <div class="header">
        <div class="header-title">
            <div class="status-dot"></div>
            <span>Mentor de Conhecimentos</span>
        </div>
        <div class="badge">Spring AI // Gemini</div>
    </div>

    <div id="chat-box">
        <div class="message ai-message">Ambiente 3D carregado. Faça sua pergunta sobre Java ou Spring AI.</div>
    </div>

    <div class="input-panel">
        <input type="text" id="userInput" placeholder="Digite sua dúvida de programação..." onkeypress="handleKeyPress(event)" autocomplete="off">
        <button class="btn-send" onclick="enviarMensagem()">Enviar</button>
    </div>
</div>

<script>
    /* ========================================================
       1. Cenário Three.js Protegido contra Falhas de Contexto
       ======================================================== */
    try {
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0b0f19, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;
        camera.position.y = 3;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const gridHelper = new THREE.GridHelper(80, 50, 0x06b6d4, 0x1e293b);
        gridHelper.position.y = -6;
        scene.add(gridHelper);

        const particlesCount = 200;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 60;
            positions[i + 1] = (Math.random() - 0.5) * 35;
            positions[i + 2] = (Math.random() - 0.5) * 50;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({
            size: 0.2,
            color: 0x8b5cf6,
            transparent: true,
            opacity: 0.8
        });

        const particlesMesh = new THREE.Points(geometry, material);
        scene.add(particlesMesh);

        let mouseX = 0, mouseY = 0;
        const panel = document.getElementById('panel');

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) - 0.5;
            mouseY = (e.clientY / window.innerHeight) - 0.5;
            panel.style.transform = `perspective(1000px) rotateY(${mouseX * 4}deg) rotateX(${-mouseY * 4}deg)`;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            gridHelper.rotation.y += 0.0008;
            particlesMesh.rotation.y -= 0.0006;
            camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 3 + 3 - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }
        animate();
    } catch (e) {
        console.warn('Three.js não pôde ser carregado, mantendo layout estático:', e);
    }

    /* ========================================================
       2. Parser Nativo Simples para Código Markdown (Sem Erros de CDN)
       ======================================================== */
    function formatarTexto(texto) {
        // Converte blocos de código ```java ... ``` em <pre><code>...</code></pre>
        let formatado = texto.replace(/```([\s\S]*?)```/g, function(match, code) {
            return '<pre><code>' + escaparHtml(code.trim()) + '</code></pre>';
        });
        // Converte `código inline`
        formatado = formatado.replace(/`([^`]+)`/g, '<code>$1</code>');
        // Converte **negrito**
        formatado = formatado.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        return formatado;
    }

    function escaparHtml(str) {
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    /* ========================================================
       3. Comunicação Segura com o Spring Boot
       ======================================================== */
    async function enviarMensagem() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chat-box');
        const texto = input.value.trim();

        if (!texto) return;

        // Renderiza mensagem do usuário
        const userDiv = document.createElement('div');
        userDiv.className = 'message user-message';
        userDiv.textContent = texto;
        chatBox.appendChild(userDiv);

        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Mensagem de status
        const aiDiv = document.createElement('div');
        aiDiv.className = 'message ai-message';
        aiDiv.textContent = 'Processando resposta...';
        chatBox.appendChild(aiDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/api/mentor/perguntar', {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain; charset=utf-8' },
                body: texto
            });

            if (!response.ok) {
                const erroTexto = await response.text();
                throw new Error(`Servidor respondeu com status ${response.status}: ${erroTexto}`);
            }

            const respostaTexto = await response.text();
            aiDiv.innerHTML = formatarTexto(respostaTexto);
        } catch (error) {
            aiDiv.textContent = `Erro na requisição: ${error.message}`;
            console.error('Detalhes do erro:', error);
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            enviarMensagem();
        }
    }
</script>

</body>
</html>
